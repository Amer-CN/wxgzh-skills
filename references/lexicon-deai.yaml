# §3.5 模型路标(6 词) → SC-010(strong,threshold 1,confidence high)
# 「还有一层」按前缀模式:r'还有一层[^。！？!?\n]',后接实际内容才命中。
model_signposts:
  - 更微妙的是
  - 还有一层
  - 只说对了一半
  - 值得注意的是
  - 需要指出的是
  - 从某种意义上说
