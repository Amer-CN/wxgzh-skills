# references/lexicon-deai.yaml
# zh-human-writing — 去 AI 味检测词表（档72C-4 新建,OBS-233 闭合）
# 用途:检测词表(哪些词该被标记),与 references/domain-lexicon.yaml(误杀防护:
# 哪些词别碰)用途相反,故不混写。词表逐字照任务书 §3.2~§3.5,一个不增一个不减。
# 词只在本文件,阈值只在 config/default.yaml pattern_thresholds,两处不得出现第二份。

version: 1

# §3.2 绝对黑话(27 词) → SC-009(strong,threshold 1,confidence high)
absolute_jargon:
  - 赋能
  - 抓手
  - 商业闭环
  - 价值闭环
  - 能力沉淀
  - 拉通
  - 底层逻辑
  - 顶层设计
  - 认知跃迁
  - 价值释放
  - 能力建设
  - 降本增效
  - 内容矩阵
  - 全链路
  - 组合拳
  - 打开想象空间
  - 结构性机会
  - 关键命题
  - 深层逻辑
  - 技术底座
  - 公共底座
  - 技术主权
  - 单点风险
  - 主脊柱
  - 材料锚点
  - 认知增量
  - 迭代闭环

# §3.3 语境黑话(14 词) → AO-013(advisory,永不升 strong)
