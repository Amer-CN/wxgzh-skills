# config/default.yaml
# zh-human-writing v1 — 默认配置

meta:
  version: "1.0"

# 默认参数（与 input-contract.md 一致）
defaults:
  source: unknown
  strategy: null  # 由 source 推导
  profile: essay
  length_retention: balanced
  output: clean

# source → strategy 映射
source_strategy_mapping:
  author_written: preserve
  ai_draft: balance
  mixed: balance
  unknown: preserve

# 长度留存率阈值
length_retention_thresholds:
  strict: 0.90
  balanced: 0.80
  free: 0.00

# 模式聚集阈值
cluster_thresholds:
  strong_contextual: 2  # 同段 ≥2 次才标记
  consecutive_isomorphic: 3  # 连续 ≥3 个相同句式

# 档72C-2/§7:逐规则逐 profile 阈值(单一真源,由 pattern_audit.load_config 注入)。
# 取值=references/patterns/strong-contextual.md 逐条声明;SC-007a 阈值 1(§4)。
pattern_thresholds:
  SC-001: {essay: 2, technical: 3, social: 2}
  SC-002: {essay: 2, technical: 3, social: 2}
  SC-003: {essay: 2, technical: 3, social: 2}
  SC-004: {essay: 2, technical: 2, social: 2}
  SC-005: {essay: 3, technical: 3, social: 3}
  SC-006: {essay: 2, technical: 2, social: 4}
  SC-007a: {essay: 1, technical: 1, social: 1}

# 保真检查
fidelity:
  deterministic_checks:
    - number
    - date
    - url
    - code
    - command
    - path
    - quote
    - user_protected
  warning_checks:
    - negation
    - condition
    - causation
    - responsibility
    - uncertainty
    - register_drift
    - voice_drift
  rollback_on_fail: true
  auto_retry: false

# 残留检查
residual_check:
  max_rounds: 1
  check_level: hard_residue_only

# 输出
output:
  max_audit_issues: 5
  benchmark_limitation_notice: true
