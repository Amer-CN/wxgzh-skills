name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install pytest jsonschema pyyaml
      - name: Byte-compile all sources
        run: python -m compileall -q wxgzh_pipeline validators scripts fake_live tests
      - name: Run tests (fake_live only — no real WeChat side effects)
        run: python -m pytest tests -q
