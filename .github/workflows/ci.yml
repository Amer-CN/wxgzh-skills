name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install pytest jsonschema pyyaml
      - name: Byte-compile all sources
        run: python -m compileall -q wxgzh_pipeline validators scripts fake_live tests
      - name: Run hermetic tests (fake_live — no real WeChat side effects)
        run: python -m pytest tests -q

  integration:
    # Real five-repo integration (P0#4): checkout each sub-skill at the EXACT full
    # commit SHA recorded in skills.lock.json (never just a branch name); the runner
    # re-verifies actual HEAD == locked commit and FAILs on any mismatch, generates
    # external install receipts, and runs a live-proof render + validate_theme_identity
    # (THEME_IDENTITY must be PASS). No real network / no WeChat side effects.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wxgzh-pipeline (this PR)
        uses: actions/checkout@v4
        with:
          path: wxgzh-pipeline
      - name: Checkout super-writer @ locked commit
        uses: actions/checkout@v4
        with:
          repository: Amer-CN/super-writer
          ref: 1e58d01e38346018886ab1ad6a183228263eae49
          path: clones/super-writer
      - name: Checkout zh-human-writing @ locked commit
        uses: actions/checkout@v4
        with:
          repository: Amer-CN/zh-human-writing
          ref: 0c8962f354e9acc73f29bc57a8b328fc98695a10
          path: clones/zh-human-writing
      - name: Checkout media-enrichment @ locked commit
        uses: actions/checkout@v4
        with:
          repository: Amer-CN/media-enrichment
          ref: 7ff7be3c01073b4657f7794f15c4052ff09abf2b
          path: clones/media-enrichment
      - name: Checkout gzh-design-skill @ locked commit
        uses: actions/checkout@v4
        with:
          repository: Amer-CN/gzh-design-skill
          ref: 0007d7e6a4493aab59070d9c31dcde83830302fd
          path: clones/gzh-design-skill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (pipeline + sub-skill runtime deps)
        run: |
          pip install pytest jsonschema pyyaml pillow requests beautifulsoup4 lxml
          for r in clones/*/requirements*.txt; do [ -f "$r" ] && pip install -r "$r" || true; done
      - name: Run cross-repo integration (fixed-commit verify + install receipts + live-proof theme)
        env:
          WXGZH_SUBSKILL_CLONES: ${{ github.workspace }}/clones
        run: |
          set +e
          python wxgzh-pipeline/scripts/run_cross_repo_integration.py \
            --result "$GITHUB_WORKSPACE/integration_result.json"
          rc=$?
          cat "$GITHUB_WORKSPACE/integration_result.json" || true
          # FAIL the job on any commit mismatch / verify_all fail / THEME_IDENTITY != PASS
          exit $rc
      - name: Cross-repo pytest (no SKIP allowed for cross-repo tests)
        env:
          WXGZH_SUBSKILL_CLONES: ${{ github.workspace }}/clones
          WXGZH_REAL_SKILLS_HOME: ${{ github.workspace }}/clones
        working-directory: wxgzh-pipeline
        run: |
          python -m pytest tests/test_hotfix1.py -q -o addopts='' -rs 2>&1 | tee out.txt
          # In the integration job WXGZH_SUBSKILL_CLONES + WXGZH_REAL_SKILLS_HOME
          # are set, so every cross-repo test MUST run — any SKIP is a failure (P0#7).
          if grep -q "SKIPPED" out.txt; then
            echo "cross-repo tests were SKIPPED (must run in integration job)"; exit 1; fi
      - name: Upload integration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-result
          path: integration_result.json
