<!DOCTYPE html>
<html>
<head><title>Duplicates Test</title></head>
<body>
  <h1>Test Page for Duplicates</h1>
  <!-- Same URL repeated -->
  <img src="https://example.com/images/duplicate1.jpg" alt="First occurrence">
  <img src="https://example.com/images/duplicate1.jpg" alt="Second occurrence (duplicate)">
  <!-- Same image, different URL (simulated by same path different query) -->
  <img src="https://cdn.example.com/images/duplicate2.jpg?v=1" alt="Version 1">
  <img src="https://cdn.example.com/images/duplicate2.jpg?v=2" alt="Version 2">
</body>
</html>
