stage: super_writer
order: 2
skill: super-writer
responsibility: Material-Heavy Full Mode 完整写作；篇幅按事实密度自动决定（禁止默认 medium=3000）
inputs:
  required: [deduplicated_items.json]
outputs:
  required:
    - generation-profile.yaml
    - writing-brief.md
    - material-readiness.yaml
    - material-ingestion-report.json
    - material-ledger.yaml
    - evidence-map.md
    - canonical_claim_registry.json
    # 76Q/OBS-287:canonical_claim_registry.json 顶层必须是 dict {claims:[],materials:[]},
    # 禁止数组;materials[].dedup_id 与 deduplicated_items.json 的 id 逐字一致;
    # claim 与 material 的 source_url 逐字相等(含锚点)。完整规则与示例见
    # super-writer/references/material-ingestion.md;机械层由 validate_single_product.py 强制。
    - core-card.md
    - outline.md
    - semantic-map.yaml
    - article.md
    - editor-report.md
    - full_mode_validator_report.json
    - handoff.yaml             # 档76A/OBS-252:full-mode 必检产物(封面供料/契约留痕)
    # 76T/OBS-293:formatter.cover.strike_assumption(可选)——被本文证据否定的旧认知/流行看法,≤40 字,
    # 须素材可支撑禁稻草人;缺失时渲染端划线句整行不渲染(不再用 hook_line 填充划线位);
    # 旧字段 strike 保留读取兼容(渲染端不再读取)。
gates:
  full_mode_validator_exit: 0
forbidden: [fixed_medium_3000]
