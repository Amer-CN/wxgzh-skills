  PER_IMAGE_MANUAL_REVIEW_REQUIRED: false
  LICENSE_VERIFICATION_REQUIRED: false
  VISIBLE_SOURCE_CAPTION_REQUIRED: false
  UNKNOWN_COPYRIGHT_BLOCKING: false
image_discovery:
  - source_url_first
  - aihot_link_only_for_trace_and_fallback
  - reject_dynamic_social_share_card
  - reject_non_rendered_og_preview
  - reject_avatar_logo_ad_decoration
  - reject_duplicate
  - keep_dev7_hotfix1_url_path_segment_rule
counts:
  BODY_IMAGES_MIN: 6
  BODY_IMAGES_TARGET: 8
  TARGET_NOT_MET_IS_WARNING: true
  MIN_NOT_MET_IS_BLOCKING: true
upload:
  serial: true
  manifest_single_writer: true
  no_orchestrator_bypass: true
per_bound_image:
