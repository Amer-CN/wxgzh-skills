stage: media_enrichment
order: 4
skill: media-enrichment
responsibility: 针对冻结终稿选图；抓取原始来源；分类/去重/上传；canonical manifest + bindings
must_run_after: zh_human_writing
depends_on_freeze: final_article_sha256
copyright_policy:
  # 77W/OBS-358:单一真源=media-enrichment SKILL.md「自动决策边界」节,本节仅镜像不改义
  COPYRIGHT_POLICY: ALLOW_UNLESS_EXPLICITLY_PROHIBITED
  USER_BLANKET_APPROVAL: false
  PER_IMAGE_MANUAL_REVIEW_REQUIRED: true
  LICENSE_VERIFICATION_REQUIRED: false
  VISIBLE_SOURCE_CAPTION_REQUIRED: false
  UNKNOWN_COPYRIGHT_BLOCKING: false
  SINGLE_SOURCE_REF: "skills/media-enrichment/SKILL.md#自动决策边界"
image_discovery:
  - source_url_first
  - aihot_link_only_for_trace_and_fallback
  - reject_dynamic_social_share_card
  - reject_non_rendered_og_preview
  - reject_avatar_logo_ad_decoration
  - reject_duplicate
  - keep_dev7_hotfix1_url_path_segment_rule
counts:
  BODY_IMAGES_MIN: 6
  BODY_IMAGES_TARGET: 8
  TARGET_NOT_MET_IS_WARNING: true
  MIN_NOT_MET_IS_BLOCKING: true
upload:
  serial: true
  manifest_single_writer: true
  no_orchestrator_bypass: true
# 76V/OBS-296(审批口径纪律):
# a) approval_readiness_sha256 一律从最新的 approval_readiness_report.json 原样照抄,
#    禁止自算、禁止引用旧轮报告;readiness 报告重生成后旧 sha 一律作废(旧批准合同自动失效)。
# 77A/OBS-308(审批合同,硬步骤):批准合同每条 single_asset 必带 approval_readiness_sha256,
#    一律从最新的 approval_readiness_report.json 原样照抄、禁止自算、禁止引用旧轮报告;
#    readiness 报告重生成后旧 sha 一律作废(旧批准合同自动失效);缺字段/引用过期 FAIL_CLOSED,不得复用旧合同。
# b) 重复/镜像资产:与其 canonical 孪生(同图)共享审批依据——批准记录指向孪生资产 ID
#    + 复用其 readiness,禁止裸批(无孪生依据不得独立批准)。
per_bound_image:
  decision: eligible
  upload_status: success
  remote_url_host: mmbiz.qpic.cn
  binding_sha256_equals_manifest_sha256: true
