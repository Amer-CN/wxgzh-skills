[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxgzh-pipeline"
version = "0.1.0.dev2+hotfix7r"
description = "WeChat 公众号 orchestration skill — one-line 发文 to draft, sequential 6-stage pipeline over installed sub-skills"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "requests>=2.28",
]

[project.scripts]
wxgzh-pipeline = "wxgzh_pipeline.cli:main"
wxgzh-pipeline-ack = "wxgzh_pipeline.ack_cli:main"

[tool.setuptools]
packages = ["wxgzh_pipeline", "wxgzh_pipeline.stages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
